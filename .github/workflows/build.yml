# Vérifie chaque Pull Request (et chaque push sur develop) : tests + construction de l'application
# pour macOS (.dmg), Windows (.exe) et Linux (.AppImage), téléchargeables dans l'onglet « Summary »
# du run (section Artifacts).
# Le contrôle requis par la règle de protection des branches s'appelle « Build macOS » : ne pas renommer.
name: Build

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: macOS, os: macos-latest, files: dist/*.dmg}
          - {label: Windows, os: windows-latest, files: dist/*.exe}
          - {label: Linux, os: ubuntu-latest, files: dist/*.AppImage}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Construire l'application
        run: npm run dist

      - name: Publier l'installateur (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: planning-chantiers-${{ matrix.label }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
