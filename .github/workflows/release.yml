# À chaque push sur main (fusion d'une PR) : construit une nouvelle version pour macOS, Windows et Linux,
# puis la publie en Release GitHub. Les applications installées détectent cette release et proposent la mise à jour.
#
# Numéro de version : celui de package.json s'il n'a jamais été publié (pour passer à 1.1.0 ou 2.0.0,
# il suffit de le modifier dans la PR), sinon la dernière version publiée + 1 sur le dernier chiffre.
#
# La release n'est créée qu'une fois les trois plateformes construites : la « dernière release »
# contient donc toujours les fichiers de toutes les plateformes.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Numéro de version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déterminer le numéro de version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          HIGHEST=$(printf '%s\n%s\n' "$BASE" "$LAST" | sort -V | tail -1)
          if [ -z "$LAST" ] || { [ "$HIGHEST" = "$BASE" ] && [ "$BASE" != "$LAST" ]; }; then
            VERSION="$BASE"
          else
            IFS=. read -r MA MI PA <<< "$LAST"
            VERSION="$MA.$MI.$((PA + 1))"
          fi
          echo "Dernière version publiée : ${LAST:-aucune} — nouvelle version : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {label: macOS, os: macos-latest}
          - {label: Windows, os: windows-latest}
          - {label: Linux, os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Construire l'application
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publication
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Planning Chantiers $VERSION" \
            --generate-notes \
            --latest
