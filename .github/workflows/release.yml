# À chaque push sur main (fusion d'une PR) : construit une nouvelle version et la publie en Release GitHub.
# Les applications installées détectent cette release et proposent la mise à jour.
#
# Numéro de version : celui de package.json s'il n'a jamais été publié (pour passer à 1.1.0 ou 2.0.0,
# il suffit de le modifier dans la PR), sinon la dernière version publiée + 1 sur le dernier chiffre.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build et publication
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Déterminer le numéro de version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          HIGHEST=$(printf '%s\n%s\n' "$BASE" "$LAST" | sort -V | tail -1)
          if [ -z "$LAST" ] || { [ "$HIGHEST" = "$BASE" ] && [ "$BASE" != "$LAST" ]; }; then
            VERSION="$BASE"
          else
            IFS=. read -r MA MI PA <<< "$LAST"
            VERSION="$MA.$MI.$((PA + 1))"
          fi
          echo "Dernière version publiée : ${LAST:-aucune} — nouvelle version : $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Construire l'application
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run dist

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.dmg dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Planning Chantiers $VERSION" \
            --generate-notes \
            --latest
